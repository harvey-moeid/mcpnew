name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check active installation configuration
        run: npm run check:installation

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run type-check

      - name: Validate wrangler config (dry-run build)
        run: npx wrangler deploy --dry-run --outdir dist

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Show security-relevant dependency versions
        run: npm ls body-parser fast-uri undici || true

      - name: Audit dependencies (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Scan for leaked secrets
        if: ${{ !cancelled() }}
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2
        with:
          extra_args: --only-verified
